<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="微光手记——记录技术实践、产品思考与日常灵感的个人博客。" />
    <meta name="theme-color" content="#f2eee3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)" />
    <script>
      // 首屏前应用阅读偏好，避免暗色用户看到白屏闪烁
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('personal-blog:reading-preferences:v1') || '{}') || {};
          var theme = saved.theme === 'light' || saved.theme === 'dark' || saved.theme === 'system' ? saved.theme : 'system';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.dataset.theme = dark ? 'dark' : 'light';
          root.dataset.readingSize = saved.size === 'sm' || saved.size === 'lg' ? saved.size : 'md';
          root.dataset.readingLeading = saved.leading === 'compact' || saved.leading === 'loose' ? saved.leading : 'normal';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="微光手记" />
    <meta property="og:title" content="微光手记 | 技术与生活随笔" />
